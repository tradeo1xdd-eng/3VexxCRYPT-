<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>3VEXXCRYPT Key Generator</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      width: 90%;
      max-width: 450px;
      margin: 80px auto;
      background: #111;
      padding: 25px;
      border-radius: 15px;
      border: 1px solid #333;
    }

    h1 {
      margin-bottom: 10px;
    }

    #key {
      background: #000;
      border: 1px solid #333;
      padding: 15px;
      margin: 20px 0;
      border-radius: 10px;
      font-size: 18px;
      word-break: break-all;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #generate {
      background: white;
      color: black;
    }

    #copy {
      background: #222;
      color: white;
    }

    #message {
      margin-top: 15px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>3VEXXCRYPT</h1>

    <p>Key Generator</p>

    <div id="key">
      Pulsa "Generar Key"
    </div>

    <button id="generate" onclick="generateKey()">
      🔑 Generar Key
    </button>

    <button id="copy" onclick="copyKey()">
      📋 Copiar Key
    </button>

    <div id="message"></div>

  </div>


  <script>

    let currentKey = "";

    function generateKey() {

      let caracteres =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

      function grupo() {

        let resultado = "";

        for (let i = 0; i < 4; i++) {

          let numero =
            Math.floor(Math.random() * caracteres.length);

          resultado += caracteres[numero];

        }

        return resultado;
      }

      currentKey =
        "3VEXX-" +
        grupo() + "-" +
        grupo() + "-" +
        grupo();

      document.getElementById("key").innerText =
        currentKey;

      document.getElementById("message").innerText =
        "Key generada correctamente";

    }


    function copyKey() {

      if (currentKey === "") {

        document.getElementById("message").innerText =
          "Primero genera una key";

        return;

      }

      navigator.clipboard.writeText(currentKey);

      document.getElementById("message").innerText =
        "Key copiada";

    }

  </script>

</body>
</html>
